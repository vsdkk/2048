<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048: ROYAL LEGENDS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* --- ROYAL THEME CSS --- */
        :root {
            --gold: #d4af37;
            --gold-dim: #aa8c2c;
            --purple-royal: #4b0082;
            --dark-bg: #050505;
            --glass-panel: rgba(12, 12, 20, 0.9);
            --tile-size: 85px;
            --gap: 12px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Lato', sans-serif;
            background-color: var(--dark-bg);
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* BACKGROUND */
        .bg-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            /* Dark Fantasy Castle Image */
            background: url('https://images.unsplash.com/photo-1599691361896-b04005e83492?q=80&w=2560&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, #000 10%, rgba(20, 0, 40, 0.7) 100%);
            backdrop-filter: blur(3px);
            z-index: -1;
        }

        /* UI COMPONENTS */
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header */
        .header-bar {
            width: 90%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-panel);
            padding: 15px 20px;
            border-radius: 15px;
            border: 1px solid rgba(212, 175, 55, 0.3); /* Gold border */
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            margin-bottom: 20px;
        }

        .title-group h1 {
            font-family: 'Cinzel', serif;
            font-size: 36px;
            margin: 0;
            background: linear-gradient(to right, #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .user-label {
            color: var(--gold);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .scores-group {
            display: flex;
            gap: 15px;
        }

        .score-box {
            text-align: center;
        }

        .label { font-size: 10px; text-transform: uppercase; color: #aaa; letter-spacing: 1px; }
        .value { font-size: 20px; font-weight: bold; color: white; }

        /* Buttons */
        .btn-gold {
            background: linear-gradient(135deg, var(--gold), var(--gold-dim));
            color: #1a0525;
            border: none;
            padding: 12px 25px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 14px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            transition: transform 0.2s;
            text-transform: uppercase;
        }
        .btn-gold:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(212, 175, 55, 0.6); }

        .btn-small {
            margin-top: 15px;
            background: rgba(255,255,255,0.1);
            color: #aaa;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }

        /* GAME BOARD */
        .game-board {
            position: relative;
            width: calc(var(--tile-size) * 4 + var(--gap) * 3 + 20px);
            height: calc(var(--tile-size) * 4 + var(--gap) * 3 + 20px);
            background: rgba(10, 5, 15, 0.95);
            border-radius: 10px;
            padding: 10px;
            border: 2px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .grid-bg {
            display: grid;
            grid-template-columns: repeat(4, var(--tile-size));
            grid-template-rows: repeat(4, var(--tile-size));
            gap: var(--gap);
        }

        .grid-cell {
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            width: 100%; height: 100%;
        }

        .tile-container {
            position: absolute;
            top: 10px; left: 10px;
            width: 100%; height: 100%;
        }

        .tile {
            position: absolute;
            width: var(--tile-size);
            height: var(--tile-size);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            font-family: 'Cinzel', serif;
            transition: transform 0.15s ease-in-out, top 0.1s linear, left 0.1s linear;
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        /* TILE COLORS (Premium Dark Theme) */
        .t2 { background: #e4e4e4; color: #333; }
        .t4 { background: #ede0c8; color: #333; }
        .t8 { background: linear-gradient(135deg, #ffb347, #ffcc33); color: #fff; border: 1px solid #ffd700; }
        .t16 { background: linear-gradient(135deg, #f37335, #fd1d1d); color: #fff; }
        .t32 { background: linear-gradient(135deg, #c31432, #240b36); color: #fff; border: 1px solid #ff4b1f; }
        .t64 { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); color: #fff; }
        .t128 { background: linear-gradient(135deg, #00c6ff, #0072ff); color: #fff; font-size: 28px; box-shadow: 0 0 15px #00c6ff; }
        .t256 { background: linear-gradient(135deg, #11998e, #38ef7d); color: #fff; font-size: 28px; box-shadow: 0 0 15px #38ef7d; }
        .t512 { background: linear-gradient(135deg, #8E2DE2, #4A00E0); color: #fff; font-size: 28px; box-shadow: 0 0 20px #8E2DE2; }
        .t1024 { background: linear-gradient(135deg, #D4AF37, #C5A028); color: #000; font-size: 24px; box-shadow: 0 0 25px #D4AF37; }
        .t2048 { background: #000; border: 2px solid #00f260; color: #00f260; font-size: 24px; box-shadow: 0 0 30px #00f260; }
        .tsuper { background: #000; border: 2px solid var(--gold); color: var(--gold); font-size: 20px; box-shadow: 0 0 30px var(--gold); }

        /* Animation */
        .tile-new { animation: pop 0.2s ease-out; }
        .tile-merged { animation: bounce 0.2s ease-in; z-index: 20; }
        @keyframes pop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes bounce { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }

        /* MODALS */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-box {
            background: #111;
            padding: 40px;
            border-radius: 15px;
            border: 1px solid var(--gold);
            text-align: center;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.2);
            width: 90%;
            max-width: 400px;
        }
        .hidden { display: none !important; }

        input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #222;
            color: white;
            font-size: 16px;
            text-align: center;
            margin-bottom: 20px;
            width: 80%;
            outline: none;
        }
        input:focus { border-color: var(--gold); }

        /* LEADERBOARD STYLES */
        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 20px 0;
            text-align: left;
            max-height: 300px;
            overflow-y: auto;
        }
        .lb-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #333;
            font-size: 14px;
        }
        .lb-rank { color: var(--gold); font-weight: bold; width: 30px; }
        .lb-name { color: #fff; flex-grow: 1; }
        .lb-score { color: #aaa; }

        @media (max-width: 500px) {
            :root { --tile-size: 70px; --gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div class="overlay"></div>

    <div id="login-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h1 style="color: var(--gold); margin-top: 0; font-family: 'Cinzel';">IDENTIFICATION</h1>
            <p style="color: #ccc;">Enter your name for the archives:</p>
            <input type="text" id="username-input" placeholder="Your Name" maxlength="15" autocomplete="off">
            <button id="login-btn" class="btn-gold">ENTER REALM</button>
        </div>
    </div>

    <div id="lb-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 style="color: var(--gold); font-family: 'Cinzel'; margin-top:0;">HALL OF FAME</h2>
            <div class="leaderboard-list" id="lb-list">
                <div style="text-align:center; color:#666;">Loading...</div>
            </div>
            <button onclick="closeLeaderboard()" class="btn-gold">CLOSE</button>
        </div>
    </div>

    <div class="container" id="game-ui">
        <div class="header-bar">
            <div class="title-group">
                <h1>2048</h1>
                <div class="user-label" id="user-display">PLAYER: ...</div>
            </div>
            <div class="scores-group">
                <div class="score-box">
                    <div class="label">SCORE</div>
                    <div class="value" id="score">0</div>
                </div>
                <div class="score-box" style="border-bottom: 2px solid var(--gold);">
                    <div class="label">BEST</div>
                    <div class="value" id="best-score">0</div>
                </div>
            </div>
        </div>

        <div class="game-board">
            <div class="grid-bg">
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            </div>
            <div class="tile-container" id="tile-layer"></div>
        </div>

        <button onclick="openLeaderboard()" class="btn-gold" style="margin-top: 25px;">🏆 LEADERBOARD</button>
        
        <button onclick="resetGame()" class="btn-small">Restart Game</button>
        <p style="opacity: 0.5; font-size: 12px; margin-top: 10px;">Use Arrow Keys or Swipe</p>
    </div>

    <script>
        // --- 1. FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyBHfu6WHAsVNq-VTTqcJim0VI-zpcgFLVw",
            authDomain: "project-7974283471119864149.firebaseapp.com",
            projectId: "project-7974283471119864149",
            storageBucket: "project-7974283471119864149.firebasestorage.app",
            messagingSenderId: "210764130315",
            appId: "1:210764130315:web:d5493d84acce6fba087f0e",
            measurementId: "G-R4HX66KYN3"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- 2. GAME STATE ---
        const size = 4;
        let board = [];
        let score = 0;
        let bestScore = 0;
        let username = localStorage.getItem('royal_2048_username');

        // DOM Elements
        const loginModal = document.getElementById('login-modal');
        const lbModal = document.getElementById('lb-modal');
        const tileLayer = document.getElementById('tile-layer');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best-score');

        // --- 3. INIT LOGIC ---
        function init() {
            if (!username) {
                // Show Login
                loginModal.classList.remove('hidden');
            } else {
                // Already logged in
                document.getElementById('user-display').innerText = "PLAYER: " + username;
                loadUserData();
                startGame();
            }
        }

        // Login Handler
        document.getElementById('login-btn').addEventListener('click', () => {
            const val = document.getElementById('username-input').value.trim();
            if(val) {
                username = val;
                localStorage.setItem('royal_2048_username', username);
                document.getElementById('user-display').innerText = "PLAYER: " + username;
                loginModal.classList.add('hidden');
                loadUserData();
                startGame();
            } else {
                alert("Please enter a name.");
            }
        });

        function loadUserData() {
            db.ref('users/' + username).on('value', snap => {
                const data = snap.val();
                if(data && data.highscore) {
                    bestScore = data.highscore;
                    bestEl.innerText = bestScore;
                }
            });
        }

        function startGame() {
            board = Array(size).fill().map(() => Array(size).fill(0));
            score = 0;
            scoreEl.innerText = "0";
            tileLayer.innerHTML = '';
            addTile();
            addTile();
            drawTiles();
        }

        window.resetGame = startGame;

        // --- 4. GAME ENGINE (Fixed Vectors) ---
        function addTile() {
            let empty = [];
            for(let r=0; r<size; r++) for(let c=0; c<size; c++) if(board[r][c]===0) empty.push({r,c});
            if(empty.length) {
                let {r,c} = empty[Math.floor(Math.random()*empty.length)];
                board[r][c] = Math.random()<0.9 ? 2 : 4;
                // We draw in main loop, but can animate appearance here if complex
            }
        }

        function drawTiles() {
            tileLayer.innerHTML = '';
            const tileSize = getComputedStyle(document.documentElement).getPropertyValue('--tile-size').trim().replace('px','') || 85;
            const gap = 12;

            for(let r=0; r<size; r++) {
                for(let c=0; c<size; c++) {
                    let val = board[r][c];
                    if(val !== 0) {
                        let div = document.createElement('div');
                        div.className = 'tile';
                        div.innerText = val;
                        
                        // Classes
                        if(val <= 2048) div.classList.add('t'+val);
                        else div.classList.add('tsuper');

                        // Position
                        let top = r * (parseInt(tileSize) + gap);
                        let left = c * (parseInt(tileSize) + gap);
                        div.style.top = top + 'px';
                        div.style.left = left + 'px';
                        
                        // New tile anim logic requires tracking, simplified here for robustness
                        tileLayer.appendChild(div);
                    }
                }
            }
        }

        function move(direction) {
            // Direction: 0=Up, 1=Right, 2=Down, 3=Left (Standard Clockwise? No, let's use explicit vectors)
            // Vectors:
            // Up: x=0, y=-1
            // Right: x=1, y=0
            // Down: x=0, y=1
            // Left: x=-1, y=0
            
            let rotated = false;
            // Normalize everything to "Left" move for logic simplicity
            // 0 (Left) -> No rotate
            // 1 (Up) -> Rotate 270 (or 90 CCW)
            // 2 (Right) -> Rotate 180
            // 3 (Down) -> Rotate 90 CW

            // Mapping inputs to internal rotation logic:
            // Input "Up" -> Needs to be standard "Left" logic applied to columns.
            // Let's stick to standard Transposition logic.

            let oldBoard = JSON.stringify(board);
            
            if (direction === 'up') {
                board = rotateLeft(board); 
                board = shiftLeft(board);
                board = rotateRight(board);
            } else if (direction === 'down') {
                board = rotateRight(board);
                board = shiftLeft(board);
                board = rotateLeft(board);
            } else if (direction === 'left') {
                board = shiftLeft(board);
            } else if (direction === 'right') {
                board = rotateRight(board);
                board = rotateRight(board);
                board = shiftLeft(board);
                board = rotateLeft(board);
                board = rotateLeft(board);
            }

            if (JSON.stringify(board) !== oldBoard) {
                addTile();
                drawTiles();
                scoreEl.innerText = score;
                if(score > bestScore) {
                    bestScore = score;
                    bestEl.innerText = bestScore;
                    db.ref('users/' + username).update({ highscore: bestScore });
                }
                // Check Game Over...
            }
        }

        // Logic helper: Shift everything Left
        function shiftLeft(grid) {
            let newGrid = [];
            for(let r=0; r<size; r++) {
                let row = grid[r].filter(v => v); // remove 0s
                let newRow = [];
                while(row.length > 0) {
                    if(row.length > 1 && row[0] === row[1]) {
                        let sum = row[0] * 2;
                        newRow.push(sum);
                        score += sum;
                        row.shift(); row.shift();
                    } else {
                        newRow.push(row[0]);
                        row.shift();
                    }
                }
                while(newRow.length < size) newRow.push(0);
                newGrid.push(newRow);
            }
            return newGrid;
        }

        function rotateLeft(grid) {
            let newGrid = Array(size).fill().map(()=>Array(size).fill(0));
            for(let r=0; r<size; r++) for(let c=0; c<size; c++) newGrid[size-1-c][r] = grid[r][c];
            return newGrid;
        }
        function rotateRight(grid) {
            let newGrid = Array(size).fill().map(()=>Array(size).fill(0));
            for(let r=0; r<size; r++) for(let c=0; c<size; c++) newGrid[c][size-1-r] = grid[r][c];
            return newGrid;
        }

        // --- 5. CONTROLS ---
        document.addEventListener('keydown', e => {
            if(!loginModal.classList.contains('hidden')) return;
            if(e.key === 'ArrowUp') move('up');
            if(e.key === 'ArrowDown') move('down');
            if(e.key === 'ArrowLeft') move('left');
            if(e.key === 'ArrowRight') move('right');
        });

        // Swipe
        let tsX=0, tsY=0;
        document.addEventListener('touchstart', e => { tsX=e.touches[0].clientX; tsY=e.touches[0].clientY; }, {passive:false});
        document.addEventListener('touchend', e => {
            if(!loginModal.classList.contains('hidden')) return;
            let dX = e.changedTouches[0].clientX - tsX;
            let dY = e.changedTouches[0].clientY - tsY;
            if(Math.abs(dX) > Math.abs(dY) && Math.abs(dX)>30) dX>0 ? move('right') : move('left');
            else if(Math.abs(dY)>30) dY>0 ? move('down') : move('up');
        }, {passive:false});
        document.addEventListener('touchmove', e => e.preventDefault(), {passive:false});

        // --- 6. LEADERBOARD ---
        window.openLeaderboard = function() {
            lbModal.classList.remove('hidden');
            const list = document.getElementById('lb-list');
            list.innerHTML = '<div style="text-align:center; color:#888;">Summoning Scrolls...</div>';
            
            db.ref('users').orderByChild('highscore').limitToLast(10).once('value', snapshot => {
                let data = [];
                snapshot.forEach(child => {
                    data.push({name: child.key, score: child.val().highscore});
                });
                data.reverse(); // Highest first
                
                list.innerHTML = '';
                data.forEach((p, index) => {
                    let item = document.createElement('li');
                    item.className = 'lb-item';
                    item.innerHTML = `
                        <span class="lb-rank">#${index+1}</span>
                        <span class="lb-name">${p.name}</span>
                        <span class="lb-score">${p.score}</span>
                    `;
                    list.appendChild(item);
                });
            });
        }
        window.closeLeaderboard = function() { lbModal.classList.add('hidden'); }

        // Start
        init();

    </script>
</body>
</html>
