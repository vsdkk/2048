<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- (No html2canvas needed anymore) -->

    <style>
        /* --- MAGICK PURPLE THEME --- */
        :root {
            --neon-purple: #b026ff;
            --neon-pink: #ff00ff;
            --deep-void: #05000a;
            --glass-purple: rgba(20, 10, 30, 0.95);
            --tile-empty: rgba(60, 20, 90, 0.2);
            --tile-size: 85px;
            --gap: 12px;
            --gold-accent: #ffd700;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--deep-void);
            color: #e0d0ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* BACKGROUND */
        .bg-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background-color: #000;
        }

        .bg-layer {
            width: 100%; height: 100%;
            /* SUBTLE PURPLE GRADIENT */
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            
            /* Flashlight Effect Mask */
            --x: 50%;
            --y: 50%;
            -webkit-mask-image: radial-gradient(circle 400px at var(--x) var(--y), black 20%, transparent 100%);
            mask-image: radial-gradient(circle 400px at var(--x) var(--y), black 20%, transparent 100%);
            
            transition: opacity 0.5s;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* COMETS ANIMATION */
        .comet {
            position: absolute;
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, var(--neon-purple), transparent);
            box-shadow: 0 0 10px var(--neon-purple);
            opacity: 0;
            transform: rotate(-45deg);
            z-index: -1;
            pointer-events: none;
            animation: fly 2s linear forwards;
        }

        @keyframes fly {
            0% { opacity: 0; transform: translate(0, 0) rotate(-45deg) scale(0.5); }
            10% { opacity: 1; }
            100% { opacity: 0; transform: translate(-300px, 300px) rotate(-45deg) scale(1.2); }
        }

        /* UI HEADER */
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 10;
        }

        .header-panel {
            width: 95%;
            background: var(--glass-purple);
            border: 1px solid rgba(176, 38, 255, 0.3);
            padding: 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: 0 0 30px rgba(100, 0, 200, 0.4), inset 0 0 20px rgba(50, 0, 100, 0.5);
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        .user-info h1 {
            font-family: 'Cinzel', serif;
            font-size: 40px;
            margin: 0;
            /* MATCHING GRADIENT TITLE */
            background: linear-gradient(to right, #fff, var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(176, 38, 255, 0.6));
            letter-spacing: 2px;
        }

        .stats-group { display: flex; gap: 15px; }
        .stat-box { text-align: center; min-width: 70px; }
        .stat-label { font-size: 10px; color: #a080c0; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .stat-value { font-size: 22px; font-weight: 800; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); }

        /* GAME BOARD */
        .board-wrapper {
            position: relative;
            background: rgba(10, 5, 20, 0.8);
            padding: var(--gap);
            border-radius: 12px;
            border: 2px solid rgba(176, 38, 255, 0.2);
            box-shadow: 0 0 50px rgba(80, 0, 180, 0.4);
            width: calc(var(--tile-size) * 4 + var(--gap) * 5); 
            height: calc(var(--tile-size) * 4 + var(--gap) * 5);
            backdrop-filter: blur(5px);
        }

        .grid-bg {
            display: grid;
            grid-template-columns: repeat(4, var(--tile-size));
            grid-template-rows: repeat(4, var(--tile-size));
            gap: var(--gap);
            width: 100%; height: 100%;
        }

        .grid-cell {
            background: var(--tile-empty);
            border-radius: 8px;
            width: 100%; height: 100%;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .tile-layer {
            position: absolute;
            top: var(--gap); left: var(--gap);
            width: calc(100% - var(--gap) * 2);
            height: calc(100% - var(--gap) * 2);
            pointer-events: none; 
        }

        .tile {
            position: absolute;
            width: var(--tile-size);
            height: var(--tile-size);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: 800;
            font-family: 'Cinzel', serif;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), top 0.1s linear, left 0.1s linear;
            z-index: 10;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.1), 0 5px 15px rgba(0,0,0,0.5);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* --- PURPLE SPECTRUM COLORS --- */
        .t2 { background: linear-gradient(135deg, #f3e5f5, #e1bee7); color: #4a148c; border: 1px solid #d1c4e9; }
        .t4 { background: linear-gradient(135deg, #e1bee7, #ce93d8); color: #4a148c; border: 1px solid #ba68c8; }
        .t8 { background: linear-gradient(135deg, #ce93d8, #ab47bc); color: #fff; border: 1px solid #9c27b0; box-shadow: 0 0 10px rgba(171, 71, 188, 0.4); }
        .t16 { background: linear-gradient(135deg, #ba68c8, #8e24aa); color: #fff; border: 1px solid #7b1fa2; box-shadow: 0 0 10px rgba(142, 36, 170, 0.5); }
        .t32 { background: linear-gradient(135deg, #ab47bc, #7b1fa2); color: #fff; border: 1px solid #6a1b9a; box-shadow: 0 0 15px rgba(123, 31, 162, 0.6); }
        .t64 { background: linear-gradient(135deg, #8e24aa, #4a148c); color: #fff; border: 1px solid #e040fb; box-shadow: 0 0 20px rgba(224, 64, 251, 0.6); animation: pulse-purple 3s infinite; }
        .t128 { background: linear-gradient(135deg, #6a1b9a, #311b92); color: #fff; font-size: 28px; border: 1px solid #7c4dff; box-shadow: 0 0 25px rgba(124, 77, 255, 0.7); }
        .t256 { background: linear-gradient(135deg, #4a148c, #880e4f); color: #fff; font-size: 28px; border: 1px solid #ff4081; box-shadow: 0 0 30px rgba(255, 64, 129, 0.7); }
        .t512 { background: linear-gradient(135deg, #311b92, #1a237e); color: #fff; font-size: 26px; border: 1px solid #536dfe; box-shadow: 0 0 35px rgba(83, 109, 254, 0.8); }
        .t1024 { background: linear-gradient(135deg, #000, #4a148c); color: #e0d0ff; font-size: 22px; border: 1px solid #d500f9; box-shadow: 0 0 40px rgba(213, 0, 249, 0.8); }
        .t2048 { background: linear-gradient(135deg, #000, #200030); color: var(--gold-accent); border: 2px solid var(--gold-accent); box-shadow: 0 0 50px var(--neon-purple), inset 0 0 20px var(--neon-purple); animation: shine 3s infinite; }
        .tsuper { background: #000; border: 2px solid #fff; color: #fff; box-shadow: 0 0 40px #fff; }

        @keyframes pulse-purple { 0% { box-shadow: 0 0 15px rgba(224, 64, 251, 0.5); } 50% { box-shadow: 0 0 25px rgba(224, 64, 251, 0.8); } 100% { box-shadow: 0 0 15px rgba(224, 64, 251, 0.5); } }
        @keyframes shine { 0% { border-color: var(--neon-purple); } 50% { border-color: #fff; } 100% { border-color: var(--neon-purple); } }

        /* TUTORIAL OVERLAY */
        #tutorial-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            pointer-events: none; z-index: 20; opacity: 0; transition: opacity 1s;
        }
        #tutorial-overlay.show { opacity: 1; }
        
        .tut-content {
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }

        .tut-keys-wrapper {
            display: flex;
            gap: 30px;
            align-items: center;
        }
        .tut-keys-group {
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 5px;
        }
        .tut-row { display: flex; gap: 5px; }
        .key-cap {
            width: 50px; height: 50px;
            border: 2px solid rgba(255,255,255,0.8);
            border-radius: 8px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; font-weight: bold;
            box-shadow: 0 4px 0 rgba(255,255,255,0.8);
            font-family: 'Montserrat', sans-serif;
            text-shadow: 0 0 5px var(--neon-purple);
            /* KEY ANIMATION */
            animation: floatKeys 2s ease-in-out infinite;
        }
        
        @keyframes floatKeys {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Stagger animations */
        .tut-keys-group .key-cap:nth-child(1) { animation-delay: 0s; }
        .tut-row .key-cap:nth-child(1) { animation-delay: 0.1s; }
        .tut-row .key-cap:nth-child(2) { animation-delay: 0.2s; }
        .tut-row .key-cap:nth-child(3) { animation-delay: 0.3s; }
        
        .tut-text { 
            font-size: 14px; font-family: 'Cinzel'; text-transform: uppercase; letter-spacing: 3px; 
            color: #fff; text-shadow: 0 0 15px var(--neon-purple);
            margin-top: 15px; font-weight: bold;
        }

        .tut-icon { 
            font-size: 60px; filter: drop-shadow(0 0 10px #b026ff); 
            animation: bounceHint 1.5s infinite; 
        }
        @keyframes bounceHint { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        /* Hide Tutorial on Mobile for Specific Elements if needed, but flex handles it */
        .tut-mobile-only { display: none; }
        @media (max-width: 768px) {
            .tut-pc-only { display: none; }
            .tut-mobile-only { display: flex; }
        }
        @media (min-width: 769px) {
            .tut-mobile-only { display: none; }
            .tut-pc-only { display: flex; }
        }

        /* GAME OVER OVERLAY / RESULT CARD */
        #game-over-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 0, 10, 0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; border-radius: 12px;
            opacity: 0; pointer-events: none; transition: opacity 0.5s;
            backdrop-filter: blur(10px);
        }
        #game-over-overlay.visible { opacity: 1; pointer-events: all; }

        .result-card {
            background: #0f0518;
            border: 3px solid var(--neon-purple);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 0 50px rgba(176, 38, 255, 0.3);
            width: 85%;
            max-width: 350px;
            transform: scale(0.9);
            transition: transform 0.3s;
        }
        #game-over-overlay.visible .result-card { transform: scale(1); }

        .result-title {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            color: #a080c0;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        .result-score {
            font-size: 56px;
            font-weight: 900;
            color: var(--gold-accent);
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            line-height: 1;
        }
        
        .result-footer {
            margin-top: 15px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
        }

        /* PARTICLES */
        .particle {
            position: absolute; width: 5px; height: 5px; background: #e0d0ff; border-radius: 50%;
            pointer-events: none; z-index: 20; animation: fadeOut 0.8s forwards;
            box-shadow: 0 0 5px #b026ff;
        }
        @keyframes fadeOut { to { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); } }

        /* FLOATING TEXT */
        .floating-text {
            position: absolute; color: #fff; font-weight: 900; font-size: 24px;
            text-shadow: 0 0 10px var(--neon-purple); pointer-events: none; z-index: 30;
            animation: floatUp 0.8s forwards; font-family: 'Montserrat', sans-serif;
        }
        @keyframes floatUp { 
            0% { transform: translateY(0) scale(1); opacity: 1; } 
            100% { transform: translateY(-50px) scale(1.5); opacity: 0; } 
        }

        /* CONTROLS */
        .btn-purple {
            background: linear-gradient(90deg, #7c4dff, #b026ff);
            border: none; padding: 12px 0; width: 80%; border-radius: 50px;
            color: #fff; font-weight: 800; font-family: 'Cinzel', serif;
            margin-top: 20px; cursor: pointer;
            box-shadow: 0 0 20px rgba(124, 77, 255, 0.4); transition: 0.2s;
        }
        .btn-purple:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(176, 38, 255, 0.7); }

        /* SHARE BUTTONS */
        .share-buttons { display: flex; gap: 10px; margin-bottom: 10px; justify-content: center; }
        .btn-share {
            border: 1px solid var(--neon-purple); 
            background: rgba(40, 10, 60, 0.8);
            color: #fff; padding: 12px 25px; border-radius: 30px; cursor: pointer;
            font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 14px;
            transition: all 0.2s; display: flex; align-items: center; gap: 8px;
            box-shadow: 0 0 20px rgba(176, 38, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-share:hover { background: #b026ff; box-shadow: 0 0 30px rgba(176, 38, 255, 0.6); transform: scale(1.05); }

        /* MODALS */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); /* TRANSPARENT BACKGROUND */
            backdrop-filter: blur(8px); /* BLUR EFFECT */
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-box {
            background: rgba(20, 10, 30, 0.85); /* Semi-transparent box */
            padding: 40px; border-radius: 20px;
            border: 2px solid var(--neon-purple); text-align: center;
            box-shadow: 0 0 80px rgba(176, 38, 255, 0.3);
            width: 90%; max-width: 450px;
            position: relative;
            z-index: 1001;
            /* Breathe animation */
            animation: breatheBox 4s ease-in-out infinite;
        }
        @keyframes breatheBox {
            0%, 100% { box-shadow: 0 0 50px rgba(176, 38, 255, 0.2); }
            50% { box-shadow: 0 0 80px rgba(176, 38, 255, 0.5); }
        }

        .modal-box h2 {
            color: #fff; 
            font-family: 'Cinzel', serif; 
            font-size: 36px; 
            margin: 0 0 20px 0; 
            background: linear-gradient(to right, #fff, var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(176, 38, 255, 0.8));
        }
        input { 
            padding: 15px; width: 100%; background: rgba(42, 10, 64, 0.8); border: 1px solid #502070; 
            color: #fff; text-align: center; margin: 20px 0; border-radius: 10px; font-size: 16px; outline: none;
        }
        input:focus { border-color: var(--neon-purple); }
        .hidden { display: none !important; }

        /* LEADERBOARD STYLING */
        .lb-list { 
            max-height: 300px; 
            overflow-y: auto; 
            text-align: left; 
            margin: 20px 0; 
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 10px;
            border: 1px solid rgba(176, 38, 255, 0.1);
        }
        .lb-item { 
            display: flex; 
            justify-content: space-between; 
            padding: 12px 15px; 
            border-bottom: 1px solid rgba(176, 38, 255, 0.1); 
            font-family: 'Montserrat', sans-serif;
            align-items: center;
            transition: background 0.2s;
        }
        .lb-rank { width: 40px; font-weight: 800; font-size: 16px; color: #a080c0; text-align: center; }
        .lb-name { flex-grow: 1; color: #e0d0ff; font-weight: 600; padding: 0 15px; }
        .lb-score { font-weight: 800; color: #fff; font-family: 'Cinzel', serif; letter-spacing: 1px; }

        /* TOP 3 HIGHLIGHTS */
        .lb-item.rank-1 {
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.2), transparent);
            border-left: 4px solid #ffd700;
            margin-bottom: 5px; border-radius: 4px;
            box-shadow: 0 2px 10px rgba(255, 215, 0, 0.1);
        }
        .lb-item.rank-1 .lb-rank { color: #ffd700; font-size: 20px; }
        .lb-item.rank-1 .lb-score { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.6); }
        .lb-item.rank-1 .lb-name { color: #fff; font-weight: 800; }

        .lb-item.rank-2 {
            background: linear-gradient(90deg, rgba(192, 192, 192, 0.2), transparent);
            border-left: 4px solid #c0c0c0;
            margin-bottom: 5px; border-radius: 4px;
        }
        .lb-item.rank-2 .lb-rank { color: #e0e0e0; font-size: 18px; }
        .lb-item.rank-2 .lb-score { color: #fff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.4); }

        .lb-item.rank-3 {
            background: linear-gradient(90deg, rgba(205, 127, 50, 0.2), transparent);
            border-left: 4px solid #cd7f32;
            margin-bottom: 5px; border-radius: 4px;
        }
        .lb-item.rank-3 .lb-rank { color: #ffab76; font-size: 18px; }
        .lb-item.rank-3 .lb-score { color: #ffab76; text-shadow: 0 0 10px rgba(205, 127, 50, 0.4); }

        @media (max-width: 500px) { :root { --tile-size: 70px; --gap: 10px; } }

    </style>
</head>
<body>

    <div class="bg-container">
        <!-- FLASHLIGHT BACKGROUND -->
        <div class="bg-layer" id="bg-layer"></div>
    </div>
    <div class="overlay"></div>

    <!-- Login -->
    <div id="login-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <!-- RESTORED GRADIENT TITLE -->
            <h1 style="font-family:'Cinzel'; margin:0 0 10px 0; background: linear-gradient(to right, #fff, var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 10px rgba(176, 38, 255, 0.6)); line-height: 1;">
                2048<br>
                <span style="font-size: 18px; letter-spacing: 8px; color: #fff; display: block; margin-top: 5px; -webkit-text-fill-color: #fff; filter: none;">MagicBlock</span>
            </h1>
            <input type="text" id="username-input" placeholder="Your Name" maxlength="12" autocomplete="off">
            <button id="login-btn" class="btn-purple">ENTER REALM</button>
            <div style="margin-top:20px; font-size:10px; color:#604080; letter-spacing: 1px;">
                crafted by <span style="color: var(--neon-purple); font-weight: bold;">vsdkk</span>
            </div>
        </div>
    </div>

    <!-- Leaderboard -->
    <div id="lb-modal" class="modal-overlay hidden">
        <div class="modal-box" style="width: 90%; max-width:480px;">
            <h2>WEEZERBORD</h2>
            <div class="lb-list" id="lb-content">Loading...</div>
            <button onclick="closeLeaderboard()" class="btn-purple" style="width:auto; padding:10px 40px;">BACK</button>
        </div>
    </div>

    <!-- Main Game -->
    <div id="game-ui" class="game-container hidden">
        <div class="header-panel">
            <div class="user-info">
                <h1 style="line-height: 0.8;">
                    <!-- MATCHING GRADIENT TITLE -->
                    2048
                    <span style="display: block; font-size: 10px; letter-spacing: 4px; color: #fff; text-shadow: none; margin-top: 5px; -webkit-text-fill-color: #fff;">MagicBlock</span>
                </h1>
                <div id="player-display" style="font-size:14px; opacity:0.8; margin-top:5px; color:#d0b0ff; font-weight:600;">
                    Mage: <span id="current-username">...</span>
                    <!-- Change user button -->
                    <span onclick="logout()" style="cursor:pointer; font-size:10px; border:1px solid #604080; padding:2px 5px; border-radius:4px; margin-left:5px; color:#a080c0; text-transform:uppercase; transition:0.2s;" onmouseover="this.style.color='#fff'; this.style.borderColor='#fff'" onmouseout="this.style.color='#a080c0'; this.style.borderColor='#604080'">CHANGE</span>
                </div>
            </div>
            <div class="stats-group">
                <div class="stat-box">
                    <div class="stat-label">SCORE</div>
                    <div class="stat-value" id="score">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">BEST</div>
                    <div class="stat-value" id="best-score">0</div>
                </div>
            </div>
        </div>

        <div class="board-wrapper" id="board-wrapper">
            <div class="grid-bg">
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            </div>
            <div class="tile-layer" id="tile-layer"></div>
            
            <!-- Result Card Overlay -->
            <div id="game-over-overlay">
                <div class="result-card">
                    <div class="result-title">SCORE</div>
                    <div class="result-score" id="final-score">0</div>
                    <div style="font-size: 18px; color: #fff; margin-bottom: 30px;">Mage: <span id="final-name" style="color:#b026ff; font-weight:bold;">...</span></div>

                    <div class="result-footer">Certified by 2048 Magick</div>
                </div>

                <button onclick="restartGame()" class="btn-purple" style="margin-top: 20px; width:auto; padding:10px 40px; position: relative; z-index: 100;">TRY AGAIN</button>
            </div>

            <!-- Tutorial Overlay -->
            <div id="tutorial-overlay">
                <div class="tut-content tut-pc-only">
                    <div class="tut-keys-wrapper">
                        <!-- WASD -->
                        <div class="tut-keys-group">
                            <div class="key-cap">W</div>
                            <div class="tut-row">
                                <div class="key-cap">A</div>
                                <div class="key-cap">S</div>
                                <div class="key-cap">D</div>
                            </div>
                        </div>
                        
                        <div style="font-size: 24px; font-weight: bold; color: rgba(255,255,255,0.5);">OR</div>

                        <!-- Arrows -->
                        <div class="tut-keys-group">
                            <div class="key-cap">↑</div>
                            <div class="tut-row">
                                <div class="key-cap">←</div>
                                <div class="key-cap">↓</div>
                                <div class="key-cap">→</div>
                            </div>
                        </div>
                    </div>
                    <div class="tut-text">Use Keys</div>
                </div>
                <div class="tut-content tut-mobile-only">
                    <div class="tut-item">
                        <div class="tut-icon">👆</div>
                        <div class="tut-text">Swipe</div>
                    </div>
                </div>
            </div>

        </div>

        <button onclick="openLeaderboard()" class="btn-purple">🏆 WEEZERBORD</button>
        <div style="margin-top:10px; color:#fff; font-size:12px; cursor:pointer; opacity: 0.7;" onclick="restartGame()">RESTART</div>
    </div>

    <script>
        // --- AUDIO ENGINE ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration, delay=0, vol=0.1) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
            gain.gain.setValueAtTime(0, audioCtx.currentTime + delay);
            gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + delay + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + delay);
            osc.stop(audioCtx.currentTime + delay + duration);
        }

        function playGameOverSound() {
             playTone(150, 'sawtooth', 1.5, 0, 0.2);
             playTone(145, 'sawtooth', 1.5, 0.1, 0.2);
             if(audioCtx.state === 'suspended') audioCtx.resume();
             const osc = audioCtx.createOscillator();
             const gain = audioCtx.createGain();
             osc.type = 'triangle';
             osc.frequency.setValueAtTime(300, audioCtx.currentTime);
             osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 1.5);
             gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
             gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5);
             osc.connect(gain);
             gain.connect(audioCtx.destination);
             osc.start();
             osc.stop(audioCtx.currentTime + 1.5);
        }

        // --- FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAS9c-ZENVkL7wsYCsuYST8mJd-2dV-cA8",
            authDomain: "project-1867017293223550555.firebaseapp.com",
            databaseURL: "https://project-1867017293223550555-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "project-1867017293223550555",
            storageBucket: "project-1867017293223550555.firebasestorage.app",
            messagingSenderId: "613645431332",
            appId: "1:613645431332:web:29260f1e6ea92a86781eb1",
            measurementId: "G-19TD39WRC3"
        };
        try { firebase.initializeApp(firebaseConfig); } catch(e){}
        const db = firebase.database();

        // --- STATE ---
        const size = 4;
        let board = [];
        let score = 0;
        let bestScore = 0;
        let username = localStorage.getItem('magick_block_user');
        let gameActive = true;

        // --- DOM ---
        const loginModal = document.getElementById('login-modal');
        const lbModal = document.getElementById('lb-modal');
        const gameUI = document.getElementById('game-ui');
        const tileLayer = document.getElementById('tile-layer');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best-score');
        const playerEl = document.getElementById('current-username');
        const boardWrapper = document.getElementById('board-wrapper');
        const bgLayer = document.getElementById('bg-layer');
        const gameOverEl = document.getElementById('game-over-overlay');
        const finalScoreEl = document.getElementById('final-score');
        const finalNameEl = document.getElementById('final-name');
        const tutorialOverlay = document.getElementById('tutorial-overlay');

        // COMET SPAWNER
        function spawnComet() {
            // Chance based on document visibility to save resources
            if (document.hidden) return;
            
            if (Math.random() > 0.3) { // 30% chance each interval
                const bgContainer = document.querySelector('.bg-container');
                const comet = document.createElement('div');
                comet.className = 'comet';
                
                // Randomize start position in the top-right area mostly
                const startY = Math.random() * window.innerHeight * 0.5; // Top half
                const startX = Math.random() * window.innerWidth;
                
                comet.style.top = startY + 'px';
                comet.style.left = startX + 'px';
                
                // Randomize animation duration
                const duration = 1.5 + Math.random() * 2;
                comet.style.animationDuration = duration + 's';
                
                bgContainer.appendChild(comet);
                
                setTimeout(() => {
                    comet.remove();
                }, duration * 1000);
            }
        }

        window.onload = () => {
            if(username) {
                document.getElementById('username-input').value = username;
            }
            loginModal.classList.remove('hidden');
            
            // Start spawning comets
            setInterval(spawnComet, 2000);
        };

        // --- FLASHLIGHT MOUSE TRACKING ---
        document.addEventListener('mousemove', (e) => {
            if (e.target.closest('.board-wrapper')) return;
            const bg = document.getElementById('bg-layer');
            bg.style.setProperty('--x', e.clientX + 'px');
            bg.style.setProperty('--y', e.clientY + 'px');
        });

        document.addEventListener('touchmove', (e) => {
             if (e.target.closest('.board-wrapper')) return;
            const bg = document.getElementById('bg-layer');
            const touch = e.touches[0];
            bg.style.setProperty('--x', touch.clientX + 'px');
            bg.style.setProperty('--y', touch.clientY + 'px');
        });

        document.getElementById('login-btn').addEventListener('click', () => {
            const val = document.getElementById('username-input').value.trim();
            if(val) {
                username = val;
                localStorage.setItem('magick_block_user', username);
                loginModal.classList.add('hidden');
                if(audioCtx.state === 'suspended') audioCtx.resume();
                showGame();
            }
        });

        function showGame() {
            gameUI.classList.remove('hidden');
            playerEl.innerText = username;
            db.ref('users/'+username).on('value', s => {
                const d = s.val();
                if(d && d.highscore) { bestScore = d.highscore; bestEl.innerText = bestScore; }
            });
            startGame();
            
            // Show Tutorial
            tutorialOverlay.classList.add('show');
            setTimeout(() => {
                tutorialOverlay.classList.remove('show');
            }, 5000);
        }

        // Change user function
        window.logout = function() {
            localStorage.removeItem('magick_block_user');
            location.reload();
        }

        function startGame() {
            board = Array(size).fill().map(() => Array(size).fill(0));
            score = 0;
            gameActive = true;
            gameOverEl.classList.remove('visible');
            updateUI();
            tileLayer.innerHTML = '';
            addTile(); addTile();
            drawTiles();
        }
        window.restartGame = startGame;

        function updateUI() {
            scoreEl.innerText = score;
        }

        function addTile() {
            let empty = [];
            for(let r=0; r<size; r++) for(let c=0; c<size; c++) if(board[r][c]===0) empty.push({r,c});
            if(empty.length) {
                let {r,c} = empty[Math.floor(Math.random()*empty.length)];
                // HARDER MODE: 20% chance for 4 (was 10%)
                board[r][c] = Math.random()<0.8 ? 2 : 4;
            }
        }

        function drawTiles() {
            tileLayer.innerHTML = '';
            const tSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tile-size')) || 85;
            const gap = 12;

            for(let r=0; r<size; r++) {
                for(let c=0; c<size; c++) {
                    let val = board[r][c];
                    if(val !== 0) {
                        let div = document.createElement('div');
                        div.className = 'tile';
                        div.innerText = val;
                        div.style.top = (r*(tSize+gap))+'px';
                        div.style.left = (c*(tSize+gap))+'px';
                        if(val <= 2048) div.classList.add('t'+val); else div.classList.add('tsuper');
                        tileLayer.appendChild(div);
                    }
                }
            }
        }

        function spawnParticles(r, c, color) {
            const tSize = 85; const gap = 12;
            const x = c * (tSize + gap) + tSize/2;
            const y = r * (tSize + gap) + tSize/2;
            for(let i=0; i<6; i++) {
                let p = document.createElement('div');
                p.className = 'particle';
                p.style.left = x + 'px'; p.style.top = y + 'px';
                p.style.backgroundColor = color || '#e0d0ff';
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 40 + 20;
                p.style.setProperty('--tx', `${Math.cos(angle)*speed}px`);
                p.style.setProperty('--ty', `${Math.sin(angle)*speed}px`);
                tileLayer.appendChild(p);
                setTimeout(() => p.remove(), 800);
            }
        }

        function showFloatingText(r, c, txt) {
            const tSize = 85; const gap = 12;
            const x = c * (tSize + gap) + tSize/2 - 10;
            const y = r * (tSize + gap);
            let el = document.createElement('div');
            el.className = 'floating-text'; el.innerText = "+" + txt;
            el.style.left = x + 'px'; el.style.top = y + 'px';
            tileLayer.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function checkGameOver() {
            for(let r=0; r<size; r++) for(let c=0; c<size; c++) if(board[r][c]===0) return false;
            for(let r=0; r<size; r++) {
                for(let c=0; c<size; c++) {
                    if(c < size-1 && board[r][c] === board[r][c+1]) return false;
                    if(r < size-1 && board[r][c] === board[r+1][c]) return false;
                }
            }
            return true;
        }

        function triggerGameOver() {
            gameActive = false;
            finalScoreEl.innerText = score;
            finalNameEl.innerText = username;
            
            gameOverEl.classList.add('visible');
            playGameOverSound();
        }

        function move(dir) {
            if(!gameActive) return;
            let startBoard = JSON.stringify(board);

            if(dir==='up') board = rotate(board, 3); 
            else if(dir==='right') board = rotate(board, 2);
            else if(dir==='down') board = rotate(board, 1);

            let addedScore = 0;
            for(let r=0; r<size; r++) {
                let row = board[r].filter(v=>v);
                let newRow = [];
                while(row.length > 0) {
                    if(row.length>1 && row[0]===row[1]) {
                        let s = row[0]*2;
                        newRow.push(s);
                        addedScore += s;
                        spawnParticles(1, 2, '#b026ff'); 
                        row.shift(); row.shift();
                    } else {
                        newRow.push(row[0]); row.shift();
                    }
                }
                while(newRow.length<size) newRow.push(0);
                board[r] = newRow;
            }

            if(dir==='up') board = rotate(board, 1);
            else if(dir==='right') board = rotate(board, 2);
            else if(dir==='down') board = rotate(board, 3);
            
            // LOGIC CHANGE: ALWAYS SPAWN IF EMPTY SPACE
            // Original: if (JSON.stringify(board) !== startBoard)
            
            let changed = JSON.stringify(board) !== startBoard;
            let canSpawn = false;
            // Check for any 0
            for(let r=0; r<size; r++) for(let c=0; c<size; c++) if(board[r][c]===0) canSpawn = true;

            if(changed) {
                if(addedScore > 0) {
                    score += addedScore;
                    if(addedScore >= 16) showFloatingText(0, 2, addedScore);
                }
                
                if(score > bestScore) {
                    bestScore = score;
                    bestEl.innerText = bestScore;
                    db.ref('users/'+username).update({highscore:bestScore});
                }
                
                updateUI();
                addTile();
                drawTiles();
            } else if (canSpawn) {
                // Board didn't move but we force spawn (hardcore mode)
                addTile();
                drawTiles();
                // Check game over in case this spawn filled the board with no moves
                if(checkGameOver()) {
                    triggerGameOver();
                }
            }

            if(changed && checkGameOver()) {
                triggerGameOver();
            }
        }

        function rotate(matrix, times) {
            let res = matrix;
            for(let t=0; t<times; t++) {
                let newMat = Array(size).fill().map(()=>Array(size).fill(0));
                for(let r=0; r<size; r++) for(let c=0; c<size; c++) newMat[c][size-1-r] = res[r][c];
                res = newMat;
            }
            return res;
        }

        document.addEventListener('keydown', e => {
            if(!loginModal.classList.contains('hidden')) return;
            
            // Prevent default scrolling
            if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight', 'KeyW', 'KeyS', 'KeyA', 'KeyD'].includes(e.code)) {
                 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
            }

            if(e.code==='ArrowUp' || e.code==='KeyW') move('up');
            if(e.code==='ArrowDown' || e.code==='KeyS') move('down');
            if(e.code==='ArrowLeft' || e.code==='KeyA') move('left');
            if(e.code==='ArrowRight' || e.code==='KeyD') move('right');
        });

        let tsX, tsY;
        document.addEventListener('touchstart', e=>{ tsX=e.touches[0].clientX; tsY=e.touches[0].clientY; }, {passive:false});
        document.addEventListener('touchend', e=>{
            if(!loginModal.classList.contains('hidden')) return;
            let dx = e.changedTouches[0].clientX - tsX;
            let dy = e.changedTouches[0].clientY - tsY;
            if(Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>30) dx>0 ? move('right') : move('left');
            else if(Math.abs(dy)>30) dy>0 ? move('down') : move('up');
        }, {passive:false});

        let lbQuery = null;
        let lbCallback = null;

        window.openLeaderboard = function() {
            lbModal.classList.remove('hidden');
            const c = document.getElementById('lb-content');
            c.innerHTML = '<div style="text-align:center; color:#a080c0; padding:20px;">Summoning Spirits...</div>';
            
            // Fetch all users to sort on client-side (reliable for small datasets)
            lbQuery = db.ref('users');
            
            lbCallback = (snapshot) => {
                let d = [];
                snapshot.forEach(ch => {
                    const val = ch.val();
                    // Basic validation to ensure it has a score
                    if(val && typeof val.highscore !== 'undefined') {
                        d.push({n:ch.key, s:val.highscore});
                    }
                });
                
                // Sort descending
                d.sort((a,b) => b.s - a.s);
                
                // Keep top 10
                d = d.slice(0, 10);
                
                c.innerHTML = '';
                if(!d.length) {
                    c.innerHTML = '<div style="text-align:center; color:#fff; padding:20px;">The Void is empty...</div>';
                    return;
                }
                
                d.forEach((p,i) => {
                    let div = document.createElement('div');
                    
                    // Highlight classes
                    if(i===0) div.className = 'lb-item rank-1';
                    else if(i===1) div.className = 'lb-item rank-2';
                    else if(i===2) div.className = 'lb-item rank-3';
                    else div.className = 'lb-item';
                    
                    let rankDisplay = '';
                    if(i===0) rankDisplay = '🏆';
                    else if(i===1) rankDisplay = '🥈';
                    else if(i===2) rankDisplay = '🥉';
                    else rankDisplay = `<span style="color: #fff; font-weight: 800;">#${i+1}</span>`;
                    
                    div.innerHTML = `<span class="lb-rank">${rankDisplay}</span> <span class="lb-name">${p.n}</span> <span class="lb-score">${p.s}</span>`;
                    c.appendChild(div);
                });
            };
            
            // Listen for changes
            lbQuery.on('value', lbCallback);
        }
        
        window.closeLeaderboard = () => {
            lbModal.classList.add('hidden');
            if(lbQuery && lbCallback) {
                lbQuery.off('value', lbCallback);
            }
        }

    </script>
</body>
</html>
