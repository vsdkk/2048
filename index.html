<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048: ENDLESS ARCANE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Exo+2:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* --- CSS СТИЛІ --- */
        :root {
            --primary: #00e5ff;   /* Неоновий блакитний */
            --secondary: #9d00ff; /* Неоновий фіолетовий */
            --dark-bg: #050505;
            --glass-bg: rgba(20, 20, 30, 0.85);
            --tile-size: 90px;
            --gap: 12px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Exo 2', sans-serif;
            background-color: var(--dark-bg);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden; /* Заборона скролу */
            user-select: none;
        }

        /* --- ФОН --- */
        .bg-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            
            /* --- СЮДИ ВСТАВ ПОСИЛАННЯ НА СВІЙ АРТ --- */
            background: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=2568') no-repeat center center;
            background-size: cover;
        }

        .overlay-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); /* Затемнення */
            backdrop-filter: blur(5px);
            z-index: -1;
        }

        /* --- МОДАЛЬНЕ ВІКНО ВХОДУ --- */
        #login-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        .login-box {
            text-align: center;
            padding: 40px;
            border: 1px solid var(--secondary);
            border-radius: 15px;
            background: rgba(0,0,0,0.8);
            box-shadow: 0 0 30px rgba(157, 0, 255, 0.3);
            max-width: 90%;
        }

        .title-text {
            font-family: 'Cinzel', serif;
            font-size: 50px;
            margin: 0 0 20px 0;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
        }

        input {
            padding: 15px;
            font-size: 18px;
            border-radius: 8px;
            border: 1px solid #555;
            background: rgba(255,255,255,0.1);
            color: white;
            text-align: center;
            width: 250px;
            outline: none;
            margin-bottom: 20px;
            font-family: 'Exo 2', sans-serif;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary); }

        .btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            color: white;
            background: linear-gradient(45deg, var(--secondary), var(--primary));
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:active { transform: scale(0.95); }
        .btn:hover { box-shadow: 0 0 20px var(--primary); }

        /* --- ІГРОВИЙ ІНТЕРФЕЙС --- */
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.5s;
        }

        .header {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .player-info { font-size: 14px; opacity: 0.8; margin-top: 5px; }

        .score-container {
            display: flex;
            gap: 10px;
        }

        .score-box {
            background: var(--glass-bg);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 15px;
            border-radius: 8px;
            text-align: center;
            min-width: 70px;
        }

        .score-label { font-size: 10px; text-transform: uppercase; color: #aaa; }
        .score-val { font-size: 20px; font-weight: bold; color: white; }

        /* --- ДОШКА --- */
        .game-board {
            position: relative;
            background: rgba(30, 30, 40, 0.9);
            padding: var(--gap);
            border-radius: 10px;
            width: calc(var(--tile-size) * 4 + var(--gap) * 3);
            height: calc(var(--tile-size) * 4 + var(--gap) * 3);
            display: grid;
            grid-template-columns: repeat(4, var(--tile-size));
            grid-template-rows: repeat(4, var(--tile-size));
            gap: var(--gap);
            box-shadow: 0 0 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .grid-cell {
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            width: 100%; height: 100%;
        }

        .tile {
            position: absolute;
            width: var(--tile-size);
            height: var(--tile-size);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: 800;
            color: #fff;
            transition: transform 0.15s ease-in-out, left 0.1s linear, top 0.1s linear;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Анімації */
        .tile-new { animation: appear 0.2s ease-out; }
        .tile-merged { animation: pop 0.15s ease-in; z-index: 20; }
        
        @keyframes appear { 0% { opacity: 0; transform: scale(0); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        /* КОЛЬОРИ ПЛИТОК (ARCANE STYLE) */
        .t2 { background: #eee4da; color: #333; }
        .t4 { background: #ede0c8; color: #333; }
        .t8 { background: #ffb347; box-shadow: 0 0 10px #ffb347; }
        .t16 { background: #ff6b6b; box-shadow: 0 0 10px #ff6b6b; }
        .t32 { background: #ff4757; box-shadow: 0 0 15px #ff4757; }
        .t64 { background: #f368e0; box-shadow: 0 0 15px #f368e0; }
        .t128 { background: var(--secondary); box-shadow: 0 0 20px var(--secondary); font-size: 32px; }
        .t256 { background: #5f27cd; box-shadow: 0 0 20px #5f27cd; font-size: 32px; }
        .t512 { background: var(--primary); box-shadow: 0 0 25px var(--primary); color: #000; font-size: 32px; }
        .t1024 { background: #00d2d3; box-shadow: 0 0 25px #00d2d3; font-size: 28px; }
        .t2048 { background: #fff; color: #000; box-shadow: 0 0 40px #fff; border: 2px solid var(--primary); font-size: 28px; }
        .tsuper { background: #111; color: #fff; border: 2px solid var(--secondary); box-shadow: inset 0 0 20px var(--secondary); font-size: 24px; }

        .hidden { display: none !important; }
        .tips { margin-top: 20px; opacity: 0.5; font-size: 12px; }

        /* Адаптивність */
        @media (max-width: 500px) {
            :root { --tile-size: 70px; --gap: 10px; }
            .game-board { width: 310px; height: 310px; }
            .title-text { font-size: 36px; }
        }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div class="overlay-layer"></div>

    <div id="login-modal">
        <div class="login-box">
            <h1 class="title-text">2048<br><span style="font-size: 24px; letter-spacing: 5px; color: white;">ARCANE</span></h1>
            <p style="margin-bottom: 20px; color: #ccc;">Архів потребує твого імені</p>
            <input type="text" id="username-input" placeholder="Ім'я..." maxlength="12" autocomplete="off">
            <br>
            <button id="start-btn" class="btn">Увійти в портал</button>
        </div>
    </div>

    <div id="game-ui" class="game-wrapper hidden">
        <div class="header">
            <div>
                <h2 style="margin:0; font-family:'Cinzel';">2048</h2>
                <div id="player-display" class="player-info">Маг: ---</div>
            </div>
            <div class="score-container">
                <div class="score-box">
                    <div class="score-label">Мана</div>
                    <div class="score-val" id="score">0</div>
                </div>
                <div class="score-box" style="border-color: var(--secondary);">
                    <div class="score-label">Легенда</div>
                    <div class="score-val" id="best-score">0</div>
                </div>
            </div>
        </div>

        <div class="game-board" id="grid-container">
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            
            <div id="tile-layer"></div>
        </div>
        
        <div class="tips">Використовуй стрілки або свайпи</div>
        <button onclick="startGame()" style="margin-top: 15px; padding: 10px 20px; background: transparent; border: 1px solid #555; color: #888; border-radius: 20px; cursor: pointer;">Перезавантажити</button>
    </div>

    <script>
        // --- 1. FIREBASE SETUP (Вставлені твої дані) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBHfu6WHAsVNq-VTTqcJim0VI-zpcgFLVw",
            authDomain: "project-7974283471119864149.firebaseapp.com",
            projectId: "project-7974283471119864149",
            storageBucket: "project-7974283471119864149.firebasestorage.app",
            messagingSenderId: "210764130315",
            appId: "1:210764130315:web:d5493d84acce6fba087f0e",
            measurementId: "G-R4HX66KYN3"
        };

        // Ініціалізація без модулів (Global Scope)
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- 2. ЛОГІКА ГРИ ---
        const size = 4;
        let board = [];
        let score = 0;
        let bestScore = 0;
        let username = localStorage.getItem('arcane_user') || "";
        
        // DOM Elements
        const loginModal = document.getElementById('login-modal');
        const gameUI = document.getElementById('game-ui');
        const usernameInput = document.getElementById('username-input');
        const startBtn = document.getElementById('start-btn');
        const tileLayer = document.getElementById('tile-layer');
        const scoreDisplay = document.getElementById('score');
        const bestDisplay = document.getElementById('best-score');
        const playerDisplay = document.getElementById('player-display');

        // Автозаповнення імені
        if(username) usernameInput.value = username;

        // Подія натискання кнопки старту
        startBtn.addEventListener('click', () => {
            const val = usernameInput.value.trim();
            if(!val) return alert("Введи ім'я, мандрівнику!");
            
            username = val;
            localStorage.setItem('arcane_user', username);
            playerDisplay.innerText = "Маг: " + username;
            
            // Анімація переходу
            loginModal.style.opacity = '0';
            setTimeout(() => {
                loginModal.classList.add('hidden');
                gameUI.classList.remove('hidden');
                loadHighScore();
                startGame();
            }, 500);
        });

        function loadHighScore() {
            db.ref('users/' + username).on('value', snap => {
                const data = snap.val();
                if(data && data.highscore) {
                    bestScore = data.highscore;
                    bestDisplay.innerText = bestScore;
                }
            });
        }

        function saveScore() {
            if(score > bestScore) {
                bestScore = score;
                bestDisplay.innerText = bestScore;
                db.ref('users/' + username).update({
                    highscore: bestScore,
                    last_played: Date.now()
                });
            }
        }

        function startGame() {
            board = Array(size).fill().map(() => Array(size).fill(0));
            score = 0;
            updateScoreUI();
            renderBoard(); // Чистимо
            addTile();
            addTile();
        }

        function addTile() {
            let empty = [];
            for(let r=0; r<size; r++)
                for(let c=0; c<size; c++)
                    if(board[r][c] === 0) empty.push({r,c});
            
            if(empty.length) {
                let {r,c} = empty[Math.floor(Math.random() * empty.length)];
                board[r][c] = Math.random() < 0.9 ? 2 : 4;
                renderSingleTile(r, c, board[r][c], true);
            }
        }

        function renderBoard() {
            tileLayer.innerHTML = '';
            for(let r=0; r<size; r++) {
                for(let c=0; c<size; c++) {
                    if(board[r][c] !== 0) {
                        renderSingleTile(r, c, board[r][c]);
                    }
                }
            }
        }

        function renderSingleTile(r, c, val, isNew = false) {
            let tile = document.createElement('div');
            tile.classList.add('tile');
            
            // Класи кольорів
            if (val <= 2048) tile.classList.add('t' + val);
            else tile.classList.add('tsuper');

            tile.innerText = val;
            
            // Позиціонування (має співпадати з CSS)
            // Плитка 90px + Відступ 12px
            const tileSize = 90; 
            const gap = 12;
            tile.style.top = (r * (tileSize + gap)) + 'px';
            tile.style.left = (c * (tileSize + gap)) + 'px';

            // ID для видалення при оновленні
            tile.id = `tile-${r}-${c}`;

            if(isNew) tile.classList.add('tile-new');

            tileLayer.appendChild(tile);
        }

        function updateView(mergedTiles) {
            // Видаляємо все і малюємо заново (найпростіший спосіб уникнути глітчів)
            tileLayer.innerHTML = '';
            for(let r=0; r<size; r++) {
                for(let c=0; c<size; c++) {
                    if(board[r][c] !== 0) {
                        let isMerged = mergedTiles.some(t => t.r === r && t.c === c);
                        let t = document.createElement('div');
                        t.className = 'tile';
                        if (board[r][c] <= 2048) t.classList.add('t' + board[r][c]);
                        else t.classList.add('tsuper');
                        
                        if(isMerged) t.classList.add('tile-merged');

                        t.innerText = board[r][c];
                        const tileSize = 90; const gap = 12;
                        t.style.top = (r * (tileSize + gap)) + 'px';
                        t.style.left = (c * (tileSize + gap)) + 'px';
                        tileLayer.appendChild(t);
                    }
                }
            }
            updateScoreUI();
        }

        function updateScoreUI() {
            scoreDisplay.innerText = score;
            saveScore();
        }

        // --- ENGINE (РУХ) ---
        function move(dir) {
            // 0:Left, 1:Up, 2:Right, 3:Down
            let rotated = false;
            if(dir===1) { rotate(); rotated=true; }
            else if(dir===2) { rotate(); rotate(); rotated=true; }
            else if(dir===3) { rotate(); rotate(); rotate(); rotated=true; }

            let changed = false;
            let mergedTiles = [];

            for(let r=0; r<size; r++) {
                let row = board[r].filter(v => v);
                let newRow = [];
                while(row.length > 0) {
                    if(row.length > 1 && row[0] === row[1]) {
                        let sum = row[0] * 2;
                        newRow.push(sum);
                        score += sum;
                        row.shift(); row.shift();
                        // Запам'ятовуємо координату злиття (приблизно, бо ще повернемо дошку)
                    } else {
                        newRow.push(row[0]);
                        row.shift();
                    }
                }
                while(newRow.length < size) newRow.push(0);
                if(newRow.join(',') !== board[r].join(',')) changed = true;
                board[r] = newRow;
            }

            if(dir===1) { rotate(); rotate(); rotate(); }
            else if(dir===2) { rotate(); rotate(); }
            else if(dir===3) { rotate(); }

            if(changed) {
                addTile();
                updateView([]); // Перемалювати
                if(checkGameOver()) setTimeout(() => alert("Game Over! Score: " + score), 500);
            }
        }

        function rotate() {
            let newBoard = Array(size).fill().map(() => Array(size).fill(0));
            for(let r=0; r<size; r++)
                for(let c=0; c<size; c++)
                    newBoard[c][size-1-r] = board[r][c];
            board = newBoard;
        }

        function checkGameOver() {
            for(let r=0; r<size; r++)
                for(let c=0; c<size; c++) {
                    if(board[r][c] === 0) return false;
                    if(c<size-1 && board[r][c] === board[r][c+1]) return false;
                    if(r<size-1 && board[r][c] === board[r+1][c]) return false;
                }
            return true;
        }

        // --- УПРАВЛІННЯ ---
        document.addEventListener('keydown', e => {
            if(!loginModal.classList.contains('hidden')) return;
            if(e.key === 'ArrowLeft') move(0);
            if(e.key === 'ArrowUp') move(1);
            if(e.key === 'ArrowRight') move(2);
            if(e.key === 'ArrowDown') move(3);
        });

        let touchStart = {x:0, y:0};
        document.addEventListener('touchstart', e => {
            touchStart.x = e.touches[0].clientX;
            touchStart.y = e.touches[0].clientY;
        }, {passive: false});

        document.addEventListener('touchend', e => {
            if(!loginModal.classList.contains('hidden')) return;
            let dx = e.changedTouches[0].clientX - touchStart.x;
            let dy = e.changedTouches[0].clientY - touchStart.y;
            if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
                if(dx > 0) move(2); else move(0);
            } else if(Math.abs(dy) > 30) {
                if(dy > 0) move(3); else move(1);
            }
        }, {passive: false});

        // Заборона скролу на мобільному
        document.addEventListener('touchmove', e => e.preventDefault(), {passive: false});

    </script>
</body>
</html>
